<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BOARD Reader</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="reader.css?v=2">
</head>
<body data-theme="paper">

<section id="shelf">
  <header id="shelfTop">
    <h1>Library</h1>
    <span class="grow"></span>
    <button id="statusBtn" type="button"><span id="dot" data-s="idle"></span><span id="statusText">Up to date</span></button>
    <button id="shelfMenu" type="button" aria-label="Menu">•••</button>
  </header>
  <div id="books"></div>
  <div id="empty" hidden>
    <h2>No books yet</h2>
    <p>On the Mac, open BOARD and drop a PDF or an ebook onto the LIBRARY notebook. It shows up here by itself.</p>
  </div>
</section>

<section id="book" hidden>
  <header id="bar">
    <button id="backBtn" type="button" aria-label="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Library</span></button>
    <div id="barTitle"></div>
    <button id="typeBtn" type="button" aria-label="Text size and paper">Aa</button>
    <button id="listBtn" type="button" aria-label="Contents and notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
  </header>
  <main id="page">
    <div id="gutter"></div>
    <div class="flow" id="flowA"></div>
    <div class="flow" id="flowB"></div>
    <div id="pv" hidden></div>
    <div id="turnshade"></div>
  </main>
  <footer id="foot"><span id="footCh"></span><span id="footPg"></span></footer>
  <div id="progress"><i id="progressFill"></i></div>
  <button id="thoughtBtn" type="button" aria-label="Add a thought. Tap to type, hold to talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-6.5L8 20v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></svg></button>
  <div id="recPill" hidden><span id="recDot"></span><span id="recText">Listening</span><span id="recTime">0:00</span></div>
</section>

<div id="pop" hidden>
  <div id="popColors"></div>
  <span class="popsep"></span>
  <button id="popThought" type="button" aria-label="Add a thought to this">Thought</button>
  <button id="popRemove" type="button" aria-label="Remove this highlight">Remove</button>
</div>

<div id="shade" hidden></div>
<section id="sheet" hidden><div id="sheetBody"></div></section>
<aside id="side" hidden>
  <header><div class="seg" id="sideTabs"><button type="button" data-t="contents" class="on">Contents</button><button type="button" data-t="notes">Notes</button></div><button id="sideClose" type="button" aria-label="Close">Done</button></header>
  <div id="sideBody"></div>
</aside>
<div id="gate" hidden></div>
<div id="toast" hidden><span id="toastText"></span><button id="toastAct" type="button" hidden></button></div>
<script src="reader.js?v=2"></script>
</body>
</html>
